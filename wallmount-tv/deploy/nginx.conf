# Nginx site for the Level Mount Co. website.
# Installed by deploy/bootstrap-ec2.sh, which replaces __DOMAIN__ with your domain(s).
# `certbot --nginx` then adds the HTTPS server block and the HTTP -> HTTPS redirect.

limit_req_zone $binary_remote_addr zone=levelmount_api:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=levelmount_site:10m rate=30r/s;
limit_req_status 429;

upstream levelmount_node {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 32k;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

    # Let's Encrypt HTTP-01 challenges.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /api/ {
        limit_req zone=levelmount_api burst=10 nodelay;
        proxy_pass http://levelmount_node;
        include /etc/nginx/snippets/levelmount-proxy.conf;
    }

    location / {
        limit_req zone=levelmount_site burst=60 nodelay;
        proxy_pass http://levelmount_node;
        include /etc/nginx/snippets/levelmount-proxy.conf;
    }
}
