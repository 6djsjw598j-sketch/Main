# Host Nginx site for MarketLens (installed by deployment/scripts/setup_nginx.sh).
# __DOMAIN__ is replaced with your domain. Certbot adds the HTTPS (443) server block and the
# HTTP->HTTPS redirect when you run `certbot --nginx`.

# Rate limits (per client IP). The API also enforces its own per-IP limit.
limit_req_zone $binary_remote_addr zone=marketlens_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=marketlens_static:10m rate=30r/s;
limit_req_status 429;

upstream marketlens_frontend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Optional: make the site private with a password (see docs/DEPLOYMENT_AWS_EC2.md, step 10b).
    # auth_basic "MarketLens";
    # auth_basic_user_file /etc/nginx/.marketlens_htpasswd;

    location /api/ {
        limit_req zone=marketlens_api burst=40 nodelay;
        proxy_pass http://marketlens_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (do not append) so clients cannot spoof their IP for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=marketlens_static burst=60 nodelay;
        proxy_pass http://marketlens_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
