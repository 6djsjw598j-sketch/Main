name: Options bot

on:
  push:
    branches: ["**"]
    paths: ["options-bot/**", ".github/workflows/options-bot.yml"]
  pull_request:
    paths: ["options-bot/**", ".github/workflows/options-bot.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: options-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: options-bot/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check optionsbot tests
      - run: ruff format --check optionsbot tests
      - run: pytest
      - run: docker build -t optionsbot:ci .
