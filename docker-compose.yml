# MarketLens production stack.
#   cp .env.example .env   # then edit secrets / API keys
#   docker compose up -d --build
# Only the frontend publishes a port, and only on 127.0.0.1: the host's Nginx (TLS) proxies to it.
name: marketlens

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketlens}
      POSTGRES_USER: ${POSTGRES_USER:-marketlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "log_min_duration_statement=1000"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # Pure cache: no persistence, bounded memory.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  backend:
    build: ./backend
    image: marketlens-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketlens}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marketlens}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  frontend:
    build: ./frontend
    image: marketlens-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

volumes:
  pgdata:
